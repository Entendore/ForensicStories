<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forensic Investigator — Complete Edition</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    :root {
      --bg: #0a0e1a;
      --panel: #151a2e;
      --card: #1a2340;
      --border: #3a4a6e;
      --accent: #667eea;
      --accent2: #764ba2;
      --ok: #28a745;
      --bad: #dc3545;
      --warn: #ffc107;
      --text: #e0e6ed;
      --dim: #8b95a7
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      background-image: radial-gradient(circle at 20% 30%, rgba(102, 126, 234, .06) 0%, transparent 50%), radial-gradient(circle at 80% 70%, rgba(118, 75, 162, .06) 0%, transparent 50%)
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 18px
    }

    header {
      background: linear-gradient(135deg, #1a1f3a, #2d1b4e);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, .5)
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px
    }

    .logo-icon {
      font-size: 2.2em;
      filter: drop-shadow(0 0 10px var(--accent));
      animation: pulseLogo 3s infinite
    }

    @keyframes pulseLogo {
      50% {
        filter: drop-shadow(0 0 22px var(--accent2))
      }
    }

    h1 {
      font-size: 1.55em;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent
    }

    .subtitle {
      font-size: .72em;
      color: var(--dim)
    }

    .stats {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      align-items: center
    }

    .stat-box {
      background: rgba(102, 126, 234, .1);
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: 8px;
      text-align: center;
      min-width: 66px;
      transition: .25s
    }

    .stat-box:hover {
      border-color: var(--accent);
      transform: translateY(-2px)
    }

    .stat-label {
      font-size: .58em;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: 1px
    }

    .stat-value {
      font-size: 1.05em;
      font-weight: bold;
      color: var(--accent)
    }

    .menu-btn {
      background: rgba(102, 126, 234, .1);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: .95em;
      transition: .2s
    }

    .menu-btn:hover {
      border-color: var(--accent);
      background: rgba(102, 126, 234, .25)
    }

    .main-layout {
      display: grid;
      grid-template-columns: 1fr 310px;
      gap: 18px
    }

    .game-panel {
      background: linear-gradient(135deg, var(--panel), #1a1f3a);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      min-height: 600px
    }

    .notebook {
      background: linear-gradient(135deg, #2a1f1a, #3a2a1f);
      border: 1px solid #5a4a3a;
      border-radius: 12px;
      padding: 16px;
      position: sticky;
      top: 18px;
      max-height: calc(100vh - 36px);
      overflow-y: auto
    }

    .notebook h2 {
      color: #d4a574;
      font-size: 1.05em;
      margin-bottom: 12px
    }

    .nb-section {
      margin-bottom: 14px
    }

    .nb-section h3 {
      color: #e8c896;
      font-size: .72em;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
      border-bottom: 1px solid #5a4a3a;
      padding-bottom: 4px
    }

    .clue-item {
      background: rgba(212, 165, 116, .1);
      border-left: 3px solid #d4a574;
      padding: 6px 9px;
      margin-bottom: 5px;
      font-size: .76em;
      border-radius: 0 5px 5px 0;
      line-height: 1.45;
      animation: slideIn .3s
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-10px)
      }

      to {
        opacity: 1;
        transform: translateX(0)
      }
    }

    .suspect-note {
      background: rgba(102, 126, 234, .1);
      border-left: 3px solid var(--accent);
      padding: 6px 9px;
      margin-bottom: 5px;
      font-size: .76em;
      border-radius: 0 5px 5px 0;
      line-height: 1.5
    }

    .suspect-note.accused {
      border-color: var(--bad);
      background: rgba(220, 53, 69, .15)
    }

    .suspect-note.cleared {
      border-color: var(--ok);
      opacity: .6
    }

    .empty-note {
      color: #7a6a5a;
      font-style: italic;
      text-align: center;
      padding: 12px;
      font-size: .82em
    }

    .notes-area {
      width: 100%;
      background: rgba(0, 0, 0, .25);
      border: 1px dashed #6a5a4a;
      border-radius: 6px;
      color: #e8d8c0;
      padding: 8px;
      font-family: 'Courier New', monospace;
      font-size: .78em;
      resize: vertical;
      min-height: 70px;
      outline: none
    }

    .btn {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: .9em;
      font-weight: 600;
      transition: .25s;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      position: relative;
      overflow: hidden
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, .4)
    }

    .btn:active:not(:disabled) {
      transform: translateY(0)
    }

    .btn:disabled {
      opacity: .4;
      cursor: not-allowed
    }

    .btn-danger {
      background: linear-gradient(135deg, #dc3545, #a02030)
    }

    .btn-secondary {
      background: linear-gradient(135deg, #3a4a6e, #2a3a5e)
    }

    .btn-success {
      background: linear-gradient(135deg, #28a745, #1e7e34)
    }

    .btn-warning {
      background: linear-gradient(135deg, #ffc107, #e0a800);
      color: #1a1f3a
    }

    .btn-small {
      padding: 6px 12px;
      font-size: .78em
    }

    .action-bar {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      flex-wrap: wrap
    }

    .case-selector {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(255px, 1fr));
      gap: 15px
    }

    .case-card {
      background: linear-gradient(135deg, #1a2340, #2a1f4e);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      cursor: pointer;
      transition: .3s;
      position: relative;
      overflow: hidden
    }

    .case-card:hover {
      transform: translateY(-5px);
      border-color: var(--accent);
      box-shadow: 0 10px 30px rgba(102, 126, 234, .3)
    }

    .case-card.solved {
      border-color: var(--ok)
    }

    .case-card.solved::after {
      content: '✓ SOLVED';
      position: absolute;
      top: 10px;
      right: 10px;
      background: var(--ok);
      color: #fff;
      padding: 3px 9px;
      border-radius: 12px;
      font-size: .65em;
      font-weight: bold
    }

    .case-card.locked {
      opacity: .45;
      cursor: not-allowed
    }

    .case-card.locked:hover {
      transform: none;
      border-color: var(--border);
      box-shadow: none
    }

    .case-number {
      color: var(--accent);
      font-size: .72em;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 6px
    }

    .case-card h3 {
      color: #fff;
      margin-bottom: 8px;
      font-size: 1.12em
    }

    .case-card p {
      color: var(--dim);
      font-size: .83em;
      line-height: 1.5;
      margin-bottom: 12px
    }

    .case-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: .78em
    }

    .difficulty {
      padding: 3px 10px;
      border-radius: 12px;
      font-size: .78em;
      font-weight: bold
    }

    .easy {
      background: rgba(40, 167, 69, .2);
      color: #51cf7a;
      border: 1px solid var(--ok)
    }

    .medium {
      background: rgba(255, 193, 7, .2);
      color: #ffc107;
      border: 1px solid var(--warn)
    }

    .hard {
      background: rgba(220, 53, 69, .2);
      color: #ff6b7a;
      border: 1px solid var(--bad)
    }

    .expert {
      background: rgba(118, 75, 162, .25);
      color: #c9a3f0;
      border: 1px solid var(--accent2)
    }

    .phase-indicator {
      display: flex;
      gap: 4px;
      margin-bottom: 15px;
      padding: 8px;
      background: rgba(0, 0, 0, .25);
      border-radius: 10px;
      border: 1px solid var(--border);
      flex-wrap: wrap
    }

    .phase-step {
      flex: 1;
      text-align: center;
      padding: 6px 3px;
      border-radius: 6px;
      font-size: .66em;
      color: var(--dim);
      background: rgba(0, 0, 0, .3);
      transition: .3s;
      position: relative;
      min-width: 58px
    }

    .phase-step.active {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      font-weight: bold;
      box-shadow: 0 0 15px rgba(102, 126, 234, .4)
    }

    .phase-step.done {
      background: rgba(40, 167, 69, .2);
      color: #51cf7a
    }

    .scene-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 8px
    }

    .scene-title {
      color: var(--accent);
      font-size: 1.2em
    }

    .timer {
      background: rgba(220, 53, 69, .12);
      border: 1px solid var(--bad);
      color: #ff6b7a;
      padding: 5px 12px;
      border-radius: 20px;
      font-family: 'Courier New', monospace;
      font-weight: bold;
      font-size: .9em
    }

    .hint-btn {
      background: rgba(255, 193, 7, .18);
      border: 1px solid var(--warn);
      color: var(--warn);
      padding: 5px 12px;
      border-radius: 15px;
      cursor: pointer;
      font-size: .78em;
      transition: .2s
    }

    .hint-btn:hover {
      background: rgba(255, 193, 7, .3)
    }

    .hint-btn:disabled {
      opacity: .4;
      cursor: not-allowed
    }

    .crime-scene {
      position: relative;
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 14px
    }

    .scene-svg {
      width: 100%;
      height: 400px;
      display: block
    }

    .scene-hotspot {
      position: absolute;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
      transition: .25s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15em;
      animation: hotPulse 2s infinite;
      background: rgba(102, 126, 234, .3);
      border: 2px solid var(--accent);
      transform: translate(-50%, -50%)
    }

    @keyframes hotPulse {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(102, 126, 234, .7)
      }

      50% {
        box-shadow: 0 0 0 12px rgba(102, 126, 234, 0)
      }
    }

    .scene-hotspot:hover {
      transform: translate(-50%, -50%) scale(1.15)
    }

    .scene-hotspot.found {
      animation: none;
      background: rgba(40, 167, 69, .35);
      border-color: var(--ok)
    }

    .scene-hotspot.empty {
      animation: none;
      background: rgba(139, 149, 167, .2);
      border: 2px dashed var(--dim);
      cursor: default
    }

    .tools-panel {
      background: rgba(0, 0, 0, .3);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px
    }

    .tools-panel h4 {
      color: var(--accent);
      margin-bottom: 8px;
      font-size: .85em
    }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(82px, 1fr));
      gap: 6px
    }

    .tool-btn {
      background: var(--card);
      border: 2px solid var(--border);
      padding: 7px 3px;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      transition: .2s;
      font-size: .68em;
      position: relative
    }

    .tool-btn:hover {
      border-color: var(--accent)
    }

    .tool-btn.selected {
      border-color: var(--warn);
      background: rgba(255, 193, 7, .12);
      box-shadow: 0 0 12px rgba(255, 193, 7, .25)
    }

    .tool-icon {
      font-size: 1.5em;
      display: block;
      margin-bottom: 2px
    }

    .tool-key {
      position: absolute;
      top: 2px;
      right: 3px;
      font-size: .7em;
      color: var(--dim);
      background: rgba(0, 0, 0, .4);
      padding: 1px 3px;
      border-radius: 3px
    }

    .evidence-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(128px, 1fr));
      gap: 10px
    }

    .evidence-item {
      background: linear-gradient(135deg, #1a2340, #2a1f4e);
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 12px 8px;
      cursor: pointer;
      transition: .25s;
      text-align: center;
      position: relative
    }

    .evidence-item:hover:not(.analyzed) {
      border-color: var(--accent);
      transform: translateY(-3px)
    }

    .evidence-item.analyzed {
      border-color: var(--ok);
      background: linear-gradient(135deg, #0d2818, #1a3a2a)
    }

    .evidence-item.red-herring.analyzed {
      border-color: var(--warn);
      background: linear-gradient(135deg, #3a2a0a, #4a3a1a)
    }

    .evidence-item.analyzed::after {
      content: '✓';
      position: absolute;
      top: 4px;
      right: 4px;
      background: var(--ok);
      color: #fff;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .7em
    }

    .evidence-item.red-herring.analyzed::before {
      content: '⚠';
      position: absolute;
      top: 4px;
      left: 4px;
      background: var(--warn);
      color: #1a1f3a;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .65em;
      font-weight: bold
    }

    .evidence-icon {
      font-size: 2.1em;
      margin-bottom: 6px
    }

    .evidence-name {
      font-size: .78em;
      font-weight: 500
    }

    .evidence-status {
      font-size: .63em;
      color: var(--dim);
      margin-top: 3px
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: var(--card);
      border-radius: 3px;
      overflow: hidden;
      margin: 8px 0
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width .5s
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .85);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 15px;
      backdrop-filter: blur(5px)
    }

    .modal.active {
      display: flex;
      animation: fadeIn .25s
    }

    @keyframes fadeIn {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    .modal-content {
      background: linear-gradient(135deg, var(--panel), #1a1f3a);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 24px;
      max-width: 760px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      animation: slideUp .3s
    }

    @keyframes slideUp {
      from {
        transform: translateY(25px);
        opacity: 0
      }

      to {
        transform: translateY(0);
        opacity: 1
      }
    }

    .modal-content h2 {
      color: var(--accent);
      margin-bottom: 10px
    }

    .modal-desc {
      color: var(--dim);
      margin-bottom: 15px;
      line-height: 1.6;
      font-size: .92em
    }

    .minigame-area {
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 15px;
      margin: 15px 0
    }

    .feedback {
      padding: 12px;
      border-radius: 8px;
      margin: 12px 0;
      font-size: .88em;
      line-height: 1.55;
      animation: slideIn .3s
    }

    .feedback.success {
      background: rgba(40, 167, 69, .15);
      color: #51cf7a;
      border-left: 4px solid var(--ok)
    }

    .feedback.error {
      background: rgba(220, 53, 69, .15);
      color: #ff6b7a;
      border-left: 4px solid var(--bad)
    }

    .feedback.info {
      background: rgba(102, 126, 234, .15);
      color: #8ba0f5;
      border-left: 4px solid var(--accent)
    }

    .feedback.warning {
      background: rgba(255, 193, 7, .15);
      color: #ffc107;
      border-left: 4px solid var(--warn)
    }

    .option-btn {
      background: var(--card);
      border: 2px solid var(--border);
      color: var(--text);
      padding: 11px 15px;
      border-radius: 8px;
      cursor: pointer;
      transition: .2s;
      text-align: left;
      width: 100%;
      margin-bottom: 8px;
      font-size: .9em
    }

    .option-btn:hover:not(:disabled) {
      background: #2a3a5e;
      border-color: var(--accent);
      transform: translateX(4px)
    }

    .option-btn.correct {
      background: rgba(40, 167, 69, .2);
      border-color: var(--ok);
      color: #51cf7a
    }

    .option-btn.incorrect {
      background: rgba(220, 53, 69, .2);
      border-color: var(--bad);
      color: #ff6b7a
    }

    .option-btn:disabled {
      cursor: default
    }

    #fpCanvas {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
      cursor: crosshair;
      touch-action: none;
      background: #141a2e
    }

    .microscope-view {
      width: 100%;
      height: 210px;
      background: radial-gradient(circle, #1a1f3a, #000);
      border-radius: 50%/30%;
      position: relative;
      overflow: hidden;
      border: 3px solid var(--border)
    }

    .microscope-specimen {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      filter: blur(8px);
      transition: filter .15s
    }

    .focus-slider {
      width: 100%;
      margin: 12px 0;
      accent-color: var(--accent)
    }

    .chemical-tubes {
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      height: 200px;
      padding: 15px 5px 35px
    }

    .test-tube {
      width: 52px;
      height: 150px;
      background: rgba(255, 255, 255, .05);
      border: 2px solid var(--border);
      border-radius: 0 0 26px 26px;
      position: relative;
      cursor: pointer;
      transition: .25s
    }

    .test-tube:hover {
      transform: translateY(-5px);
      border-color: var(--accent)
    }

    .test-tube.selected {
      border-color: var(--warn);
      box-shadow: 0 0 18px rgba(255, 193, 7, .35)
    }

    .tube-liquid {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60%;
      border-radius: 0 0 24px 24px;
      transition: .4s
    }

    .tube-label {
      position: absolute;
      bottom: -30px;
      width: 110px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      font-size: .68em;
      color: var(--dim)
    }

    .chroma-plate {
      background: #f5f5f0;
      border-radius: 8px;
      height: 200px;
      position: relative;
      overflow: hidden
    }

    .chroma-lane {
      position: absolute;
      bottom: 0;
      width: 48px;
      height: 100%;
      border-left: 1px dashed #ccc;
      cursor: default;
      transition: .2s
    }

    .chroma-lane.clickable {
      cursor: pointer
    }

    .chroma-lane.clickable:hover {
      background: rgba(102, 126, 234, .15)
    }

    .chroma-band {
      position: absolute;
      left: 6px;
      right: 6px;
      height: 9px;
      border-radius: 3px;
      opacity: 0;
      transition: bottom 2s ease-out, opacity .4s
    }

    .chroma-label {
      position: absolute;
      bottom: 5px;
      font-size: .65em;
      color: #333;
      text-align: center;
      width: 48px;
      font-weight: bold
    }

    .dna-table {
      width: 100%;
      border-collapse: collapse;
      font-family: 'Courier New', monospace;
      font-size: .85em
    }

    .dna-table th,
    .dna-table td {
      padding: 8px 5px;
      text-align: center;
      border: 1px solid var(--border)
    }

    .dna-table th {

    }

      font-size: 1.1em
    }

    .achievement {

    @keyframes toastIn {

    }

    .encyclopedia-grid {

    .encyclopedia-card {

      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      cursor: pointer;
      transition: .25s
    }

    .encyclopedia-card:hover {

    .encyclopedia-card.unlocked {

    }

    .encyclopedia-icon {

    .encyclopedia-title {

    }

    .achievement-card {

      border: 2px solid var(--border);

    .achievement-card-title {

    .career-stats {

    .career-stat {

    }

    .career-stat-value {

    .career-stat-label {

      text-transform: uppercase;

    }

    .difficulty-selector {

    }

    .difficulty-option {

    }

    .difficulty-option-desc {

    .confetti {

    }

    @keyframes confettiFall {

      }

    }

    .info-box {
      background: rgba(0, 0, 0, .25);

    @media(max-width:900px) {
      .main-layout {
        grid-template-columns: 1fr
      }

      }

        padding: 10px
      }

      .game-panel {
        padding: 14px
      }

      .scene-svg {
        height: 300px
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <div class="logo">

    <div class="main-layout">

        </div>

  <div class="modal" id="modal">
    <div class="modal-content" id="modalContent"></div>
  </div>

  <script>
    /* ============================================================
       UTILITIES
    ============================================================ */
    const $ = id => document.getElementById(id);
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ c ]));
    const shuffle = a => { const b = [ ...a ]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[ b[ i ], b[ j ] ] = [ b[ j ], b[ i ] ]; } return b; };
    const pick = a => a[ Math.floor(Math.random() * a.length) ];
    function loadJSON(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } }
    function store(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { } }

    /* ============================================================
       AUDIO
    ============================================================ */
    let audioCtx = null, soundOn = true;
    function initAudio() { if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } } }
    function tone(freq, dur, type = 'sine', vol = .08) {
      if (!soundOn || !audioCtx) return;
      try
      {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = type; o.frequency.value = freq;
        g.gain.setValueAtTime(vol, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + dur);
        o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + dur);
      } catch (e) { }
    }
    function sfx(name) {
      if (name === 'click') tone(760, .05, 'square', .035);
      if (name === 'success') { tone(523, .12); setTimeout(() => tone(659, .12), 110); setTimeout(() => tone(784, .22), 220); }
      if (name === 'fail') { tone(300, .16, 'sawtooth', .06); setTimeout(() => tone(190, .28, 'sawtooth', .06), 160); }
      if (name === 'achievement') { [ 523, 659, 784, 1047 ].forEach((f, i) => setTimeout(() => tone(f, .22), i * 110)); }
    }
    function toggleSound() { soundOn = !soundOn; $('soundToggle').textContent = soundOn ? '🔊' : ''; if (soundOn) { initAudio(); sfx('click'); } }
    document.addEventListener('pointerdown', initAudio, { once: true });

    /* ============================================================
       ENCYCLOPEDIA
    ============================================================ */
    const ENCYCLOPEDIA = [
      { id: 'fingerprint', icon: '👆', title: 'Fingerprint Analysis', desc: 'Every fingerprint is unique. Loops, whorls and arches classify the patterns.', detail: 'Latent prints are invisible until developed with powder, ninhydrin, cyanoacrylate fuming or alternate light sources. Ninhydrin reacts with amino acids in sweat to produce a purple compound (Ruhemann purple). AFIS searches millions of prints. Traditionally at least 12 matching ridge characteristics are required for a court-quality identification, though modern practice also weighs overall pattern quality and context.' },
      { id: 'dna', icon: '🧬', title: 'DNA Profiling', desc: 'STR analysis compares short tandem repeat regions that vary between individuals.', detail: 'Forensic DNA profiling examines 13–20 STR loci such as D3S1358, vWA, FGA and TH01. Each person inherits one allele from each parent, so a locus shows one or two numbers. The chance of two unrelated people matching at every locus is far below one in a billion. DNA can be recovered from blood, saliva, hair roots and shed skin cells — even "touch DNA" from a handled object. Contamination control and chain of custody are essential.' },
      { id: 'toxicology', icon: '☠️', title: 'Forensic Toxicology', desc: 'Detection of drugs, poisons and alcohol in biological samples.', detail: 'GC-MS (gas chromatography–mass spectrometry) is the confirmatory gold standard: chromatography separates the mixture and mass spectrometry identifies each compound. Screening tests such as immunoassays are fast but can produce false positives. Cyanide blocks cellular respiration; potassium cyanide is an industrial salt with a characteristic bitter-almond odour. Hair testing can reveal exposure over months, while blood reflects recent intake.' },
      { id: 'ballistics', icon: '🔫', title: 'Firearms & Ballistics', desc: 'Rifling leaves unique striation marks on a bullet — a mechanical fingerprint.', detail: 'As a bullet travels down a barrel, the rifling grooves scrape characteristic lands and grooves into it. Firing-pin impressions, breech-face marks and extractor scratches on the casing provide additional identifiers. IBIS/NIBIN compares recovered bullets and cartridges across cases. Gunshot residue (GSR) patterns help estimate shooting distance: a contact wound deposits a soot collar, while distant shots may deposit almost none.' },
      { id: 'bloodspatter', icon: '🩸', title: 'Bloodstain Pattern Analysis', desc: 'Stain shape, size and distribution reconstruct the dynamics of an event.', detail: 'Low-velocity spatter (<5 ft/s) suggests dripping or blunt force; medium velocity (5–25 ft/s) suggests beating or stabbing; high velocity (>100 ft/s) suggests a firearm. The tail of an elliptical stain points in the direction of travel. Impact angle is calculated as arcsin(width ÷ length): a circular stain is a 90° impact, a thin streak is a glancing blow. Convergence of multiple stains locates the area of origin.' },
      { id: 'digital', icon: '💻', title: 'Digital Forensics', desc: 'Recovering reliable evidence from phones, computers and networks.', detail: 'Investigators create a bit-for-bit forensic image and work only on the copy, preserving the original. Write-blockers prevent accidental modification. Deleted files, browser history, GPS logs, metadata and cloud sync records can reconstruct a timeline. Cell-site analysis triangulates a handset between towers; accuracy ranges from tens of metres in cities to kilometres in rural areas. A phone location is not proof of who was holding it.' },
      { id: 'trace', icon: '🔬', title: 'Trace Evidence', desc: 'Locard\'s Exchange Principle: every contact leaves a trace.', detail: 'Fibres, hair, glass, paint, soil and pollen transfer during contact. Fibres are identified by polarised light microscopy and FTIR spectroscopy. Glass is compared by refractive index and elemental composition. Paint is layered, and the sequence of layers can identify a make and model. Soil combines mineralogy with organic content. Transfer sequence matters: an older deposit may be entirely unrelated to the crime.' },
      { id: 'pathology', icon: '🔪', title: 'Forensic Pathology', desc: 'Determining cause, mechanism, manner and time of death.', detail: 'Cause of death is the injury or disease; mechanism is the physiological derangement; manner is natural, accident, suicide, homicide or undetermined. Time since death is estimated using algor mortis (cooling, roughly 1–1.5°C per hour initially), rigor mortis (begins 2–4 h, peaks around 12 h, dissipates by 36–48 h) and livor mortis (pooling begins within 30 min, becomes fixed after roughly 8–12 h). Wound angle and trajectory can contradict a claimed suicide.' },
      { id: 'document', icon: '📄', title: 'Document Examination', desc: 'Detecting forgeries, alterations and hidden writing.', detail: 'Infrared and ultraviolet illumination reveal different inks and erasures. Ink layer chromatography separates dye components, allowing two seemingly identical inks to be distinguished. Electrostatic detection reads indented writing left on pages beneath a signed sheet. Thermal receipt paper fades because its dye is heat-sensitive; controlled heating can restore the image. Watermarks, paper fibre and printer steganographic dots can date and source a document.' },
      { id: 'arson', icon: '🔥', title: 'Arson & Accelerants', desc: 'Finding the residue that proves a fire was started deliberately.', detail: 'Investigators sample the point of origin and the lowest burned areas, where liquid accelerants sink. Activated charcoal strips absorb volatile residues, which are then analysed by GC-MS. Petroleum products leave distinctive hydrocarbon patterns. "Crazed" glass and deep charring alone do not prove arson — building materials and fire duration matter. An accelerant detection canines provides screening, not confirmation.' }

        const tip = assist && ev ? `${h.label} — suggested: ${TOOLS[ ev.tool ].name}` : h.label;

      }).join('')}
 </div>
 <div class="info-box" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
  <div>Evidence collected: <strong style="color:var(--accent)">${S.found.length} / ${c.evidence.length}</strong>${S.wrongTools ? ` · <span style="color:var(--bad)">${S.wrongTools} tool error${S.wrongTools > 1 ? 's' : ''}</span>` : ''}</div>
  <button class="btn" onclick="goPhase('lab')" ${S.found.length ? '' : 'disabled'}>→ Take evidence to the lab</button>

    function selectTool(id) { S.tool = id; sfx('click'); renderScene(); }
    function investigate(i) {
      const c = currentCase(), h = c.hotspots[ i ];

      {
        const ev = c.evidence.find(e => e.id === h.evidence);
        openModal(`<h2>${ev.icon} ${esc(ev.name)}</h2><div class="info-box">Already collected and logged. Analyze it in the laboratory.</div><div class="action-bar"><button class="btn btn-secondary" onclick="closeModal()">Close</button></div>`); return;

        openModal(`<h2>🔍 ${esc(h.label)}</h2><p class="modal-desc">You examine the area thoroughly, photograph it and record your findings.</p><div class="feedback warning"><strong>No evidentiary value.</strong><br>Not every interesting object is a clue. Learning to exclude irrelevant areas is part of the science.</div><div class="action-bar"><button class="btn" onclick="closeModal();renderScene()">Continue searching</button></div>`);
        snapshot(); return;
      }
      const ev = c.evidence.find(e => e.id === h.evidence);
      if (ev.tool === S.tool)
      {
        S.found.push(ev.id); sfx('success');
        openModal(`<h2>✓ Evidence Collected</h2><p class="modal-desc">Using the <strong>${TOOLS[ S.tool ].name}</strong>, you recover the item without contaminating it.</p>
   <div style="text-align:center;padding:18px"><div style="font-size:3.6em">${ev.icon}</div><h3 style="color:var(--accent);margin-top:8px">${esc(ev.name)}</h3><p style="color:var(--dim);margin-top:8px;line-height:1.6">${esc(ev.description)}</p></div>
   <div class="feedback success"><strong>Chain of custody established.</strong><br>Item logged, sealed and labelled. It is now available in the laboratory.</div>
   <div class="action-bar"><button class="btn" onclick="closeModal();renderScene()">Continue investigation</button></div>`);
        toast('Evidence found', ev.name, ev.icon); snapshot();
      } else
      {
        S.wrongTools++; S.flags.nodamage = false; sfx('fail');

   <div class="feedback error"><strong>The evidence may be compromised.</strong><br>This item required the <strong>${TOOLS[ ev.tool ].name}</strong>. Mishandling can destroy trace material and weaken a case in court.</div>
   <div class="action-bar"><button class="btn btn-warning" onclick="collectDamaged(${i})">Recover it anyway (damaged)</button><button class="btn btn-secondary" onclick="closeModal()">Leave it and reselect</button></div>`);

    function collectDamaged(i) {

  <div class="feedback ${e.red ? 'warning' : 'info'}"><strong>${e.red ? '⚠ Red herring identified' : '🔎 Analysis result'}</strong><br><br>${esc(e.clue)}</div>

    /* ---- FINGERPRINT DUSTING ---- */
    function mgFingerprintHTML() {
      return `<p style="color:var(--dim);font-size:.85em;margin-bottom:10px">🖌️ Click and drag to dust the surface. Reveal at least 60% of the print to lift it.</p>
 <canvas id="fpCanvas" width="640" height="240"></canvas>
 <div class="progress-bar"><div class="progress-fill" id="fpProgress" style="width:0%"></div></div>
 <div style="color:var(--dim);font-size:.8em">Coverage: <span id="fpCount">0</span>%</div>`;
    }
    function initFingerprint() {
      const cv = $('fpCanvas'); if (!cv) return;
      const ctx = cv.getContext('2d'), W = 640, H = 240;
      const print = document.createElement('canvas'); print.width = W; print.height = H;
      const p = print.getContext('2d');
      p.strokeStyle = '#e8c87a'; p.lineWidth = 2.2;
      for (let r = 7; r < 100; r += 6.5)
      {
        p.beginPath(); p.ellipse(320, 125, r, r * 1.12, 0, .15, Math.PI * 1.9); p.stroke();
      }
      p.strokeStyle = '#f4dca0'; p.lineWidth = 1.4;
      for (let i = 0; i < 14; i++) { p.beginPath(); p.moveTo(250 + i * 10, 40); p.quadraticCurveTo(240 + i * 11, 120, 265 + i * 8, 205); p.stroke(); }
      const mask = document.createElement('canvas'); mask.width = W; mask.height = H;
      const mc = mask.getContext('2d');
      const tmp = document.createElement('canvas'); tmp.width = W; tmp.height = H;
      const tc = tmp.getContext('2d');
      const cells = new Set(), COLS = 20, ROWS = 8, R = 27;
      let drawing = false;
      function paint(x, y) {
        mc.fillStyle = '#fff'; mc.beginPath(); mc.arc(x, y, R, 0, Math.PI * 2); mc.fill();
        for (let gx = Math.max(0, Math.floor((x - R) / 32)); gx <= Math.min(COLS - 1, Math.floor((x + R) / 32)); gx++)
          for (let gy = Math.max(0, Math.floor((y - R) / 30)); gy <= Math.min(ROWS - 1, Math.floor((y + R) / 30)); gy++)cells.add(gx + ',' + gy);
        redraw();
      }
      function redraw() {
        ctx.fillStyle = '#141a2e'; ctx.fillRect(0, 0, W, H);
        ctx.strokeStyle = 'rgba(255,255,255,.035)'; ctx.lineWidth = 1;
        for (let i = 0; i < W; i += 40) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, H); ctx.stroke(); }
        tc.clearRect(0, 0, W, H); tc.globalCompositeOperation = 'source-over'; tc.drawImage(print, 0, 0);
        tc.globalCompositeOperation = 'destination-in'; tc.drawImage(mask, 0, 0); tc.globalCompositeOperation = 'source-over';
        ctx.drawImage(tmp, 0, 0);
        const pct = Math.min(100, Math.round(cells.size / (COLS * ROWS) * 100));
        $('fpProgress').style.width = pct + '%'; $('fpCount').textContent = pct;
        if (pct >= 60 && !MG.done) { mgDone(MG.id); }
      }
      function pos(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
      cv.addEventListener('pointerdown', e => { drawing = true; cv.setPointerCapture(e.pointerId); const q = pos(e); paint(q.x, q.y); e.preventDefault(); });
      cv.addEventListener('pointermove', e => { if (!drawing) return; const q = pos(e); paint(q.x, q.y); });
      cv.addEventListener('pointerup', () => drawing = false);
      cv.addEventListener('pointercancel', () => drawing = false);
      redraw();
    }

 <div class="microscope-view"><div class="microscope-specimen" id="specimen">

    /* ---- CHROMATOGRAPHY ---- */
    function mgChromaHTML(e) {
      const palette = [ '#c0392b', '#2980b9', '#27ae60', '#8e44ad', '#d35400' ];

    function makeBoardDraggable(el) {

        const r = el.getBoundingClientRect(), b = $('evidenceBoard').getBoundingClientRect();
        ox = e.clientX - r.left; oy = e.clientY - r.top;
        el.setPointerCapture(e.pointerId); el.style.zIndex = 10; e.preventDefault();
      });
      el.addEventListener('pointermove', e => {
        if (!down) return;
        const b = $('evidenceBoard').getBoundingClientRect();
        let x = e.clientX - b.left - ox, y = e.clientY - b.top - oy;
        if (Math.abs(x - parseFloat(el.style.left)) > 3 || Math.abs(y - parseFloat(el.style.top)) > 3) moved = true;
        x = Math.max(4, Math.min(x, b.clientWidth - el.offsetWidth - 4));
        y = Math.max(14, Math.min(y, b.clientHeight - el.offsetHeight - 8));
        el.style.left = x + 'px'; el.style.top = y + 'px'; el._moved = moved;
        drawThreads();

      el.addEventListener('pointerup', () => { down = false; el.style.zIndex = 2; });

    function useHint(context) {
      if (S.hints <= 0) { toast('No hints left', 'Earn more by choosing Rookie mode.', '💡'); return; }
      S.hints--; S.flags.nohints = false; updateStats(); sfx('click');
      const c = currentCase(); let hint = '';
      if (context === 'scene')
      {
        const next = c.hotspots.find(h => h.evidence && !S.found.includes(h.evidence));
        hint = next ? `Try the <strong>${esc(next.label.toLowerCase())}</strong>. The correct instrument is the <strong>${TOOLS[ c.evidence.find(e => e.id === next.evidence).tool ].name}</strong>.` : 'You have recovered everything at the scene. Take it to the laboratory.';
      } else if (context === 'lab')
      {
        const next = c.evidence.find(e => S.found.includes(e.id) && !S.analyzed.includes(e.id));
        hint = next ? `Analyze the <strong>${esc(next.name)}</strong>. ${esc(next.description)}` : 'All collected evidence is analyzed. Move on to interviews.';
      } else if (context === 'interviews')
      {
        const next = c.witnesses.find(w => !S.witnesses.includes(w.id));
        hint = next ? `Interview <strong>${esc(next.name)}</strong> — they saw something the others did not.` : 'All witnesses interviewed. Now interrogate the suspects with your physical evidence.';
      } else if (context === 'lineup')
      {
        hint = c.lineup.hint;
      } else if (context === 'timeline')
      {
        hint = `The earliest event is <strong>${esc(c.timeline[ 0 ].time)} — ${esc(c.timeline[ 0 ].desc)}</strong>. Work forward, and watch the AM/PM boundary carefully.`;
      } else if (context === 'deduction')
      {
        const counts = {}; c.suspects.forEach(s => counts[ s.id ] = 0);
        c.evidence.forEach(e => { if (S.analyzed.includes(e.id)) e.effective.forEach(id => counts[ id ]++); });
        const best = Object.entries(counts).sort((a, b) => b[ 1 ] - a[ 1 ])[ 0 ];
        hint = `Count the physical clues that actually implicate each person. <strong>${esc(c.suspects.find(s => s.id === best[ 0 ]).name)}</strong> is contradicted by ${best[ 1 ]} independent pieces of evidence. Remember to exclude the red herrings.`;
      }
      openModal(`<h2>💡 Investigative Hint</h2><div class="feedback info">${hint}</div><p style="color:var(--dim);font-size:.8em">Hints remaining: ${S.hints} · Using a hint reduces your final score.</p><div class="action-bar" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Understood</button></div>`);
      snapshot();
    }

    /* ============================================================
       MENUS: TUTORIAL, SETTINGS, ENCYCLOPEDIA, ACHIEVEMENTS, CAREER
    ============================================================ */
    function showTutorial() {
      openModal(`<h2>🔬 Welcome, Detective</h2>
 <p class="modal-desc">You are a forensic scientist. You do not guess — you test, measure and prove.</p>
 ${[
          [ '📋', '1. Read the brief', 'Understand the crime, the people and what is at stake.' ],
          [ '🔍', '2. Search the scene', 'Select a tool (keys 1–9 and 0), then click the pulsing hotspots. The wrong tool damages evidence. Some locations are dead ends.' ],
          [ '🔬', '3. Analyze in the lab', 'Ten real mini-games: dust fingerprints, focus a microscope, choose reagents, read chromatograms, match STR profiles, compare striations, measure blood spatter, perform an autopsy and triage digital evidence.' ],
          [ '💬', '4. Interview & interrogate', 'Ask witnesses questions. Then confront suspects with evidence and watch their composure collapse. Clear the innocent.' ],
          [ '👁️', '5. Run a photo lineup', 'Let the witness identify the suspect. A wrong ID weakens your case.' ],
          [ '📅', '6. Reconstruct the timeline', 'Drag events — or use the arrows — into chronological order.' ],
          [ '📌', '7. Build the evidence board', 'Drag notes around. Click a clue then a suspect to connect them with red thread.' ],
          [ '⚖️', '8. Make your accusation', 'Submit the culprit. You are graded S/A/B/C/D on evidence coverage, interviews, lineup, timeline, pressure applied and time remaining.' ]
        ].map(([ i, t, d ]) => `<div class="feedback info" style="font-size:.85em"><strong>${i} ${t}</strong><br>${d}</div>`).join('')}
 <div class="feedback warning" style="font-size:.85em"><strong>⚠ Beware red herrings.</strong> Some evidence looks incriminating but does not withstand scientific scrutiny. Analyze everything before deciding.</div>
 <div class="action-bar" style="justify-content:center">
  <button class="btn" onclick="closeModal()">🎯 Understood</button>
  <button class="btn btn-secondary" onclick="career.tutorial=true;saveCareer();closeModal();toast('Tutorial dismissed','You can reopen it any time with ❓.','✅')">Don't show again</button>
 </div>`);
    }
    function showSettings() {
      openModal(`<h2>⚙️ Division Settings</h2><p class="modal-desc">Choose your difficulty. You can change this between cases; an active investigation keeps its original timer.</p>
 <div class="difficulty-selector">
 ${Object.entries(DIFF).map(([ k, d ]) => `<div class="difficulty-option ${career.settings.difficulty === k ? 'selected' : ''}" onclick="setDifficulty('${k}')">
  <div class="difficulty-option-title">${d.label}</div><div class="difficulty-option-desc">${d.desc}</div></div>`).join('')}</div>
 <div class="info-box">
  <label style="display:flex;align-items:center;gap:10px;cursor:pointer">
   <input type="checkbox" ${career.settings.assist ? 'checked' : ''} onchange="career.settings.assist=this.checked;saveCareer()">
   <span><strong>Tool suggestions</strong><br><small>Hover over a crime scene hotspot to see which instrument it needs. Disabled automatically in Expert mode.</small></span>
  </label>
 </div>
 <div class="info-box">
  <strong style="color:var(--accent)">Scoring rubric (1000 points)</strong><br>
  Correct accusation 300 · Evidence coverage 200 · Witness interviews 100 · Photo lineup 100 · Timeline 100 · Interrogation 100 · Time bonus up to 100.<br>
  Deductions: 25 per tool error, 40 per hint used.<br>
  <strong>Grades:</strong> S ≥ 900 · A ≥ 750 · B ≥ 600 · C ≥ 400 · D below.
 </div>
 <div class="action-bar" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Save & close</button></div>`);
    }
    function setDifficulty(k) { career.settings.difficulty = k; saveCareer(); updateStats(); showSettings(); sfx('click'); }
    function showEncyclopedia() {
      openModal(`<h2>📚 Forensic Encyclopedia</h2>
 <p class="modal-desc">Real forensic science, explained. Entries unlock as you analyze the corresponding evidence. <strong>${career.encyclopedia.length} / ${ENCYCLOPEDIA.length} unlocked.</strong></p>
 <div class="encyclopedia-grid">
 ${ENCYCLOPEDIA.map(e => {
        const ok = career.encyclopedia.includes(e.id); return `
  <div class="encyclopedia-card ${ok ? 'unlocked' : 'locked'}" onclick="${ok ? `showEncEntry('${e.id}')` : `toast('Locked','Analyze related evidence in a case to unlock this entry.','🔒')`}">
   <div class="encyclopedia-icon">${ok ? e.icon : '🔒'}</div>
   <div class="encyclopedia-title">${ok ? esc(e.title) : 'Classified'}</div>
   <div class="encyclopedia-desc">${ok ? esc(e.desc) : 'Analyze evidence to unlock.'}</div></div>`;
      }).join('')}</div>
 <div class="action-bar" style="justify-content:flex-end"><button class="btn btn-secondary" onclick="closeModal()">Close</button></div>`);
      sfx('click');
    }
    function showEncEntry(id) {
      const e = ENCYCLOPEDIA.find(x => x.id === id); if (!e) return;
      openModal(`<h2>${e.icon} ${esc(e.title)}</h2><p class="modal-desc">${esc(e.desc)}</p>
  <div class="feedback info" style="line-height:1.8">${esc(e.detail)}</div>
  <div class="action-bar"><button class="btn btn-secondary" onclick="showEncyclopedia()">← All entries</button><button class="btn" onclick="closeModal()">Close</button></div>`);
    }
    function showAchievements() {
      openModal(`<h2>🏆 Detective Achievements</h2>
 <p class="modal-desc"><strong>${career.achievements.length} / ${ACHIEVEMENTS.length}</strong> unlocked. Achievements persist across sessions.</p>
 <div class="achievements-grid">${ACHIEVEMENTS.map(a => {
        const ok = career.achievements.includes(a.id);
        return `<div class="achievement-card ${ok ? 'earned' : 'locked'}"><div class="achievement-card-icon">${a.icon}</div><div class="achievement-card-title">${esc(a.title)}</div><div class="achievement-card-desc">${esc(a.desc)}</div></div>`;
      }).join('')}</div>
 <div class="action-bar" style="justify-content:flex-end"><button class="btn btn-secondary" onclick="closeModal()">Close</button></div>`);
      sfx('click');
    }
    function showCareer() {
      const grades = Object.values(career.grades);
      const avg = grades.length ? grades.reduce((s, g) => s + 'SABCD'.indexOf(g), 0) / grades.length : 4;
      const avgLetter = 'SABCD'[ Math.round(avg) ];
      openModal(`<h2>📊 Career Record</h2>
 <div class="career-stats">
  ${[ [ career.count, 'Cases Solved' ], [ career.score.toLocaleString(), 'Career Points' ], [ career.achievements.length, 'Achievements' ], [ career.encyclopedia.length, 'Encyclopedia' ], [ avgLetter, 'Average Grade' ] ].map(([ v, l ]) => `<div class="career-stat"><div class="career-stat-value">${v}</div><div class="career-stat-label">${l}</div></div>`).join('')}
 </div>
 <h3 style="color:var(--accent);margin:18px 0 10px">Case Performance</h3>
 <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px">
 ${CASES.map(c => `<div style="background:var(--card);border:1px solid var(--border);padding:12px;border-radius:8px">
  <div style="color:var(--accent);font-size:.72em">${c.number}</div>
  <div style="font-weight:bold;margin:5px 0;font-size:.9em">${esc(c.title)}</div>
  <div style="font-size:.85em;color:${career.solved.includes(c.id) ? 'var(--ok)' : 'var(--dim)'}">${career.solved.includes(c.id) ? `Grade <strong class="grade-${career.grades[ c.id ]}">${career.grades[ c.id ]}</strong>` : 'Not yet solved'}</div></div>`).join('')}</div>
 <div class="info-box" style="margin-top:18px">Progress is stored in your browser. Clearing browser data will erase your career. Use <strong>Download report</strong> after a case to keep a permanent copy.</div>
 <div class="action-bar" style="justify-content:space-between">
  <button class="btn btn-danger btn-small" onclick="resetCareer()">🗑️ Reset career</button>
  <button class="btn btn-secondary" onclick="closeModal()">Close</button>
 </div>`);
      sfx('click');
    }
    function resetCareer() {
      if (!confirm('Erase ALL progress: solved cases, scores, grades, achievements, encyclopedia entries and notes? This cannot be undone.')) return;
      if (!confirm('Really? This is permanent.')) return;
      try { localStorage.removeItem('fg3_career'); localStorage.removeItem('fg3_save'); } catch (e) { }
      location.reload();
    }

    /* ============================================================
       BOOT
    ============================================================ */
    function boot() {
      // Migrate any stale snapshot whose case is now invalid
      const saved = loadJSON('fg3_save', null);
      if (saved && !CASES.some(c => c.id === saved.caseId)) deleteSnapshot();
      S.caseId = null; S.phase = 'cases'; S.hints = DIFF[ career.settings.difficulty ].hints;
      render();
      if (!career.tutorial) setTimeout(showTutorial, 650);
    }
    boot();
  </script>
</body>

</html>
